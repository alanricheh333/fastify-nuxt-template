name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check architecture
        run: pnpm architecture:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check database migrations
        run: pnpm --filter @app/api db:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

      - name: Apply database migrations
        run: pnpm --filter @app/api db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

      - name: Run API E2E tests
        run: pnpm --filter @app/api test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
