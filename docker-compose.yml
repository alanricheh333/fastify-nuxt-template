services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build
    command: ['pnpm', '--filter', '@app/api', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 10000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CORS_ALLOW_CREDENTIALS: 'false'
      RATE_LIMIT_MAX: 300
      RATE_LIMIT_WINDOW_MS: 60000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      DB_POOL_MAX: 10
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONNECTION_TIMEOUT_MS: 5000
      DB_SSL: 'false'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres-data:
